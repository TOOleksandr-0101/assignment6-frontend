    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">O</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Part 1 (Basics)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="part2.html">Part 2 (Effects)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="part3.html">Part 3 (DOM)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="part4.html">Part 4 (Animations)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="part5.html">Part 5 (Project)</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="card p-4 shadow-sm mb-4">
            <h2>Task 5: Add & Remove Elements</h2>
            <div class="my-3 d-flex gap-2">
                <button id="appendBtn" class="btn btn-primary">.append() (Add to End)</button>
                <button id="prependBtn" class="btn btn-success">.prepend() (Add to Start)</button>
                <button id="removeBtn" class="btn btn-danger">.remove() (Last Item)</button>
            </div>
            <ul id="myList" class="list-group">
                <li class="list-group-item">Item 1</li>
                <li class="list-group-item">Item 2</li>
            </ul>
        </div>

        <div class="card p-4 shadow-sm mb-4">
            <h2>Task 6: Modifying Attributes</h2>
            <div class="my-3">
                <img id="attrImg" src="https://picsum.photos/300/180?random=10" alt="Image" class="rounded mb-2 d-block">
                <a id="attrLink" href="https://google.com" target="_blank" class="btn btn-outline-secondary">Go to Google</a>
            </div>
            <div class="d-flex gap-2">
                <button id="changeSrcBtn" class="btn btn-info text-white">Change Image (src)</button>
                <button id="changeHrefBtn" class="btn btn-warning">Change Link (href)</button>
            </div>
        </div>

        <div class="card p-4 shadow-sm">
            <h2>Task 7: Form Interaction</h2>
            <div class="row g-3 my-2">
                <div class="col-md-6">
                    <label class="form-label">Name:</label>
                    <input type="text" id="liveNameInput" class="form-control" placeholder="Enter name...">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email:</label>
                    <input type="email" id="liveEmailInput" class="form-control" placeholder="Enter email...">
                </div>
            </div>
            <div class="p-3 bg-light border rounded mt-3">
                <h5>Live Output:</h5>
                <p class="mb-1">Name: <b id="nameDisplay">-</b></p>
                <p class="mb-0">Email: <b id="emailDisplay">-</b></p>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">made by Oleksandr</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="part3.js"></script>
