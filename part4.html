    <main class="container my-5">
        <div class="card p-4 shadow-sm mb-4">
            <h2>Task 8: Basic Animation</h2>
            <div class="p-3 my-2 bg-light border rounded" style="height: 180px; position: relative;">
                <div id="boxBasic" class="anim-box"></div>
            </div>
            <div class="d-flex gap-2">
                <button id="basicAnimBtn" class="btn btn-primary">Start Basic Animation</button>
                <button id="resetBasicBtn" class="btn btn-outline-secondary">Reset</button>
            </div>
        </div>

        <div class="card p-4 shadow-sm mb-4">
            <h2>Task 9: Sequential Animations</h2>
            <div class="p-3 my-2 bg-light border rounded" style="height: 220px; position: relative;">
                <div id="boxSeq" class="anim-box" style="background-color: #198754;"></div>
            </div>
            <div class="d-flex gap-2">
                <button id="seqAnimBtn" class="btn btn-success">Start Sequence (Right → Down → Shrink → Reset)</button>
            </div>
        </div>

        <div class="card p-4 shadow-sm">
            <h2>Task 10: Combined Animation</h2>
            <div class="p-3 my-2 bg-light border rounded" style="height: 180px; position: relative;">
                <div id="boxComb" class="anim-box" style="background-color: #dc3545;"></div>
            </div>
            <div class="d-flex gap-2">
                <button id="combAnimBtn" class="btn btn-danger">Start Combined (Opacity + Size + Move)</button>
                <button id="resetCombBtn" class="btn btn-outline-secondary">Reset</button>
            </div>
        </div>
    </main>
